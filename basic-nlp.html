						# NLP Workshop

						## Part 1: NLP Basics

						[olaf.janssen@fontys.nl](olaf.janssen@fontys.nl)

						[https://olafjanssen.github.io/nlp-workshop/](https://olafjanssen.github.io/nlp-workshop/)
					</script>

				<section data-markdown>
					<script type="text/template">
						## What is NLP?

						- Search engines
						- Machine translators
						- Sentiment analyzers
						- Text summarizers
						- Entity extraction (names, locations, events)
						- Chatbots
						- Image search/captioning
						- Text classification (spam, fake news, pro or con)
						- Speech recognition
						
						Reference: [NLP progress by Sebastian Ruder](https://github.com/sebastianruder/NLP-progress)
					</script>
				</section>
				<section data-markdown>
					<script type="text/template">
						## Why is NLP so interesting?
						
						Language is how we (quite effectively) share knowledge, build relationships, understand things, and think.
						- We can converts concepts of any complexity into a linear chain of words.
						- Once a model understands language, we can tell it to do whatever we want.

					</script>
				</section>
				<section data-markdown>
					<script type="text/template">
						## Why was NLP dead < 2018?

						How it was done:
						- rule-based (grammar) algorithms (old school tools: - [spaCy](https://spacy.io), [NLTK](https://www.nltk.org))
						- word-based statistics (aap = 1, noot = 2, mies = 3, ...), requires (stemming, lemmatization, normalization)
						- standard machine learning algorithms
					</script>
				</section>
				<section data-markdown>
					<script type="text/template">
						## Why is it now undead?

						1. **vector embedding** instead of word-based statistics
						2. **tokenization** instead of lexicon (limited dictionary)
						3. **Transformer** architecture
						4. dddddaaaaatttttaaaa
					</script>
				</section>
				<section data-markdown>
					<script type="text/template">
						## NLP Pipeline

						1. **tokenize**: break up your text data into chunks
						2. turn text into **numerical data**
						3. condense the data so it captures **meaning**
						4. **search** for a response using the meaning
						5. use encoded response to **generate** new text

					</script>
				</section>
				<section data-markdown>
					<script type="text/template">
						## Tokenizers

						With a lot of data, we split text into any bits (not just words) to capture any expression, long-words (Planetenverteidigungskanonenkommandant), languages using other glyphs, even raw data.
						
						[Play around](https://tokenvisualizer.netlify.app/) with tokenizers.

						Usually a LLM model comes with its own tokenizer. [Huggingface Tokenizers](https://huggingface.co/docs/tokenizers/index)
					</script>
				</section>
				<section data-markdown>
					<script type="text/template">
						## Vector embeddings

						**Word vectors** or **word embedding**: In effect, a word vector determines the meaning of a word by the type of words it is seen with in proximity.

						[Read](https://towardsdatascience.com/a-beginners-guide-to-word-embedding-with-gensim-word2vec-model-5970fa56cc92) how they're trained.
						
						Math with embeddings example:
						- “king” + “woman” - "man" → “queen”
						- “Harry Potter” + “university” → “Hogwarts”
						
						Play around with [GloVe](https://lamyiowce.github.io/word2viz/) or [Embedding Projector](https://projector.tensorflow.org/).
						
						Popular implementations: [Word2Vec](https://code.google.com/archive/p/word2vec/), [GloVe](https://nlp.stanford.edu/projects/glove/), [FastText](https://fasttext.cc)
					</script>
				</section>
				<section data-markdown>
					<script type="text/template">
						## Vector embeddings
						What are they? ([visual explainer](https://ig.ft.com/generative-ai/)) 
						
						Adding the word vectors of a sentence generates a vector that conveys the combined meaning of that sentence: math with words!
						
						Similarly to token-embeddings, we can go to sentence-embeddings, whole-text embeddings.
						
						Embedding vectors are independent of text-length, dimension determines its expressive power.
					</script>
				</section>
				<section data-markdown>
					<script type="text/template">
						## Distance Metrics

						- **Euclidian distance**: Measures distance along dimensions
						- **[Cosine similarity](http://blog.christianperone.com/2013/09/machine-learning-cosine-similarity-for-vector-space-models-part-iii/)** : Angle between two vectors

						Now you can create a search engine!
					</script>

						## Seq2Seq Timeline

						- 1986 - Recurrent Neural Networks (RNN)
						- 1997 - Long Short-Term Memory (LSTM)
						- 2017 - Transformers (robots in disguise)

						A historical [TLDR;](https://www.youtube.com/watch?v=TQQlZhbC5ps&ab_channel=CodeEmporium)
					</script>

				<section data-markdown>
					<script type="text/template">
						## Transformers

						Now comes the introduction of the Bi-directional [Transformer architecture](https://jalammar.github.io/illustrated-transformer/)[2](https://medium.com/inside-machine-learning/what-is-a-transformer-d07dd1fbec04).
						
						Transformer based models use _self-attention_ and _positional encoding_, _segment encoding_, _multi-headed attention_. It allows making connections across large textual distances, and in multiple hierarchical levels. More on that in the advanced workshop. 
						
						- [LLM Visualization](https://bbycroft.net/llm)
						- Other good explainer: [3Blue1Brown](https://www.youtube.com/watch?v=wjZofJX0v4M&ab_channel=3Blue1Brown)
						- Simple exercises to build your own transformer: [GPTandChill](https://www.gptandchill.ai/codingproblems)
						- [Transformers in Excel](https://docs.google.com/spreadsheets/d/1nbz3z88-0b41dLliRkKcXPnEk_xGd3LmPCqjmUxSWtU/edit#gid=1641427179)
						- [Technical transformer explainer](https://www.youtube.com/watch?v=zxQyTK8quyY&ab_channel=StatQuestwithJoshStarmer)
					</script>
				</section>

						## Generation

						Transformers generate per token using a [decoding strategy](https://towardsdatascience.com/decoding-strategies-that-you-need-to-know-for-response-generation-ba95ee0faadc), such as top-P or [beam search](https://huggingface.co/spaces/m-ric/beam_search_visualizer)-like approach.
