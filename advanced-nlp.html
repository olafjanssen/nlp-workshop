						### Mini-recap: Retrieval analogue

						Query ~ search engine query<br>
						Key ~ title of a web page<br>
						Value ~ content of a web page<br>
						
						Lookup table:<br>
						```table = { "key0": "value0", "key1": "value1", ... }```<br><br>
						Query Process:<br>
						```table["key1"] => "value1"```

						QKV-mechanism in transformers [visually explained](https://epichka.com/blog/2023/qkv-transformer/)
					</script>
				</section>

						### Model Configuration
					
						- Model Size (Number of Parameters)
						- Context Window (Sequence Length)
						- Temperature
						- Top-k Sampling
						- Top-p (Nucleus) Sampling
						- Penalties

						[Visually explained](https://www.bighummingbird.com/blogs/llm-hyperparameter)
						
					</script>					
				</section>

				<section data-markdown>
					<script type="text/template">
						### Model Downsizing
					
						- Model distilling: large parent teaches trains smaller child
						- [Model Quantization](https://newsletter.maartengrootendorst.com/p/a-visual-guide-to-quantization), e.g. from float32 to int4
						- Sparse models: only use important input tokens
						- [Mix-of-Experts](https://newsletter.maartengrootendorst.com/p/a-visual-guide-to-mixture-of-experts): split model in specialized subnetworks
						
					</script>					
				</section>

						- Basic fine-tuning towards chat assistant, instruction understanding

						- Model alignment: [Reinforcement Learning from Human/AI Feedback](https://huggingface.co/blog/rlhf)

					</script>
